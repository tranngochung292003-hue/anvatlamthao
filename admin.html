<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Ăn Vặt Lâm Thao</title>
<style>
:root{--ink:#3a150e;--sun:#ffc20e;--red:#e0301f;--cream:#fff8ea;--line:#f0e2c8;--mute:#7b6258;--ok:#2e8b4a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:50px}
header{background:var(--ink);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.w{max-width:780px;margin:auto;padding:0 12px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--sun);font-weight:700}
button:disabled{opacity:.5}button.g{background:#fff;border:1px solid var(--line)}button.r{background:var(--red);color:#fff}button.k{background:var(--ok);color:#fff}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;margin-bottom:8px;font-size:16px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{flex:1;min-width:max-content;background:#fff;border:2px solid var(--line)}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.c small{color:var(--mute)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}
.b{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sun);font-size:.8rem;font-weight:700}
.b.Mới{background:var(--red);color:#fff}.b.Đã{background:#cfe9d6}.b.Đang{background:#ffd9a0}
.pv{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.st div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:1.2rem}.st small{color:var(--mute)}
.fl{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}.fl button{background:#fff;border:1px solid var(--line);padding:6px 12px;white-space:nowrap}.fl button.on{background:var(--sun)}
.hide{display:none}#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9;max-width:92vw;text-align:center}
label.ck{display:flex;align-items:center;gap:8px;margin-bottom:10px}label.ck input{width:auto;margin:0}
</style></head><body>
<header><b>🛠️ Admin Ăn Vặt Lâm Thao</b><span><button class="g" id="rf">↻</button> <button class="g" id="out">Thoát</button></span></header>
<div class="w">
 <div id="login" class="c" style="margin-top:20px"><b>Đăng nhập</b><br><br><input id="key" type="password" placeholder="Mật khẩu admin (ADMIN_KEY)" autocomplete="current-password"><button id="go" style="width:100%">Vào</button></div>
 <div id="app" class="hide">
  <div class="st"><div><b id="s1">0</b><small>Đơn hôm nay</small></div><div><b id="s2">0đ</b><small>Doanh thu hôm nay</small></div><div><b id="s3">0</b><small>Đơn mới chờ xử lý</small></div></div>
  <div class="tabs"><button data-t="o" class="on">Đơn hàng</button><button data-t="p">Sản phẩm</button><button data-t="r">Đánh giá</button><button data-t="s">Cài đặt</button></div>
  <div id="o"><div class="fl" id="fl"></div><div id="ol"></div></div>
  <div id="p" class="hide">
   <div class="c"><b id="ft">Thêm sản phẩm</b><br><br>
    <input id="n" placeholder="Tên món" maxlength="60"><input id="d" placeholder="Mô tả ngắn" maxlength="100">
    <div class="row"><input id="pr" type="number" inputmode="numeric" placeholder="Giá bán"><input id="ol2" type="number" inputmode="numeric" placeholder="Giá cũ (nếu có)"></div>
    <div class="row"><select id="cat"><option value="nhanh">Đồ ăn nhanh</option><option value="vat">Đồ ăn vặt</option><option value="uong">Đồ uống</option><option value="combo">Combo</option></select><input id="em" placeholder="Emoji 🍟"><input id="tg" placeholder="Nhãn (Bán chạy...)"></div>
    <div class="row" style="flex-wrap:nowrap"><img id="pv" class="pv" alt=""><input id="file" type="file" accept="image/*" style="flex:1"></div>
    <label class="ck"><input id="on" type="checkbox" checked>Hiển thị trên web</label>
    <button id="save">Lưu sản phẩm</button> <button class="g" id="reset">Làm mới form</button></div>
   <div id="pl"></div>
  </div>
  <div id="r" class="hide"></div>
  <div id="s" class="hide"><div class="c"><b>Cài đặt cửa hàng</b><br><br>
    <label class="ck"><input id="cp" type="checkbox">Tạm nghỉ bán (khách không đặt được)</label>
    <input id="cn" placeholder="Thông báo khi nghỉ (VD: Quán nghỉ Tết đến 5/2)" maxlength="200">
    <div class="row"><div><small>Phí giao (đ)</small><input id="cf" type="number" inputmode="numeric"></div><div><small>Miễn phí từ (đ)</small><input id="cr" type="number" inputmode="numeric"></div></div>
    <div class="row"><div><small>Giờ mở cửa (0–24)</small><input id="co" type="number" min="0" max="24"></div><div><small>Giờ đóng cửa (0–24)</small><input id="cc" type="number" min="0" max="24"></div></div>
    <button id="sc">Lưu cài đặt</button></div></div>
 </div>
</div><div id="msg"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyFkloT5OSrStEVY7vk2M1PTfxVerxJG-BzPUBThPqHse2LZOllHMigtpmaqN4ofXYQRA/exec";
const $=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>Number(v||0).toLocaleString("vi-VN")+"đ",NX={"Mới":["Xác nhận","Đã xác nhận"],"Đã xác nhận":["Giao hàng","Đang giao"],"Đang giao":["Đã giao xong","Đã giao"]};
let KEY=sessionStorage.getItem("ak")||"",D={orders:[],products:[],reviews:[],statuses:[],stats:{},cfg:{}},img="",eid="",flt="all",lastNew=-1,timer,ac;
function msg(t,ms=2500){const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display="none",ms)}
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.2;o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.18)})}catch(_){}}
async function post(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...o,key:KEY})});return r.json()}
async function load(silent){try{const j=await(await fetch(API+"?a=admin&key="+encodeURIComponent(KEY))).json();
  if(!j.ok){sessionStorage.removeItem("ak");$("login").classList.remove("hide");$("app").classList.add("hide");clearInterval(timer);if(!silent)msg("Sai mật khẩu");return}
  D=j;sessionStorage.setItem("ak",KEY);$("login").classList.add("hide");$("app").classList.remove("hide");
  if(lastNew>=0&&j.stats.pending>lastNew){beep();msg("🛎️ Có đơn mới!",5000);document.title="(!) Đơn mới – Admin"}
  lastNew=j.stats.pending;draw();clearInterval(timer);timer=setInterval(()=>load(true),30000)}catch(e){if(!silent)msg("Không kết nối được máy chủ")}}
function draw(){
 $("s1").textContent=D.stats.count;$("s2").textContent=fmt(D.stats.revenue);$("s3").textContent=D.stats.pending;
 const F=[["all","Tất cả"],["Mới","Mới"],["doing","Đang xử lý"],["Đã giao","Đã giao"],["Đã hủy","Đã hủy"]];
 $("fl").innerHTML=F.map(f=>`<button data-f="${f[0]}" class="${flt==f[0]?"on":""}">${f[1]}</button>`).join("");
 const L=D.orders.filter(o=>flt=="all"||(flt=="doing"?o.status=="Đã xác nhận"||o.status=="Đang giao":o.status==flt));
 $("ol").innerHTML=L.map(o=>{const n=NX[o.status];return `<div class="c"><div class="row"><b>${esc(o.code)}</b><span class="b ${esc(o.status.split(" ")[0])}">${esc(o.status)}</span></div><small>${esc(o.time)} · ${esc(o.pay)}</small>
 <p><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p>${esc(o.address)}</p><p>${esc(o.items)}</p>${o.note?`<p><i>📝 ${esc(o.note)}</i></p>`:""}
 <p><b>${fmt(o.total)}</b> · <a href="${esc(o.map)}" target="_blank" rel="noopener">📍 Xem bản đồ</a></p>
 <div class="row">${n?`<button class="k" data-code="${esc(o.code)}" data-st="${n[1]}">${n[0]}</button>`:""}${n?`<button class="r" data-code="${esc(o.code)}" data-st="Đã hủy">Hủy đơn</button>`:""}</div></div>`}).join("")||"<p>Không có đơn.</p>";
 $("pl").innerHTML=D.products.map(p=>`<div class="c row" style="flex-wrap:nowrap"><img class="pv" src="${esc(p.img||"")}" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1"><b>${esc(p.e)} ${esc(p.n)}</b> ${p.on?"":'<span class="b">Ẩn</span>'}<br><small>${fmt(p.p)} · ${esc(p.c)}</small></div><button class="g" data-e="${esc(p.id)}">Sửa</button><button class="r" data-x="${esc(p.id)}">Xóa</button></div>`).join("")||"<p>Chưa có sản phẩm. Web sẽ dùng menu mẫu cho đến khi bạn thêm món.</p>";
 $("r").innerHTML=D.reviews.map(r=>`<div class="c"><b>${esc(r.item)}</b> ${"★".repeat(r.stars)}<br>${esc(r.text)}<br><small>${esc(r.code)} · ${esc(r.time)}</small></div>`).join("")||"<p>Chưa có đánh giá.</p>";
 const c=D.cfg;if(c&&!$("s").dataset.f){$("s").dataset.f=1;$("cp").checked=c.paused;$("cn").value=c.notice;$("cf").value=c.fee;$("cr").value=c.free;$("co").value=c.open;$("cc").value=c.close}}
$("go").onclick=()=>{KEY=$("key").value.trim();beep.u=1;load()};$("key").onkeydown=e=>{if(e.key=="Enter")$("go").click()};
$("out").onclick=()=>{sessionStorage.removeItem("ak");location.reload()};$("rf").onclick=()=>load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){document.title="Admin – Ăn Vặt Lâm Thao";if(KEY)load(true)}});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));["o","p","r","s"].forEach(t=>$(t).classList.toggle("hide",t!=b.dataset.t))});
$("o").onclick=async e=>{const f=e.target.dataset.f;if(f){flt=f;draw();return}
 const code=e.target.dataset.code,st=e.target.dataset.st;if(!code)return;if(st=="Đã hủy"&&!confirm("Hủy đơn "+code+"?"))return;
 e.target.disabled=true;const j=await post({action:"setStatus",code,status:st});msg(j.ok?"Đã cập nhật: "+st:"Lỗi cập nhật");load(true)};
function reset(){eid="";img="";["n","d","pr","ol2","em","tg"].forEach(i=>$(i).value="");$("on").checked=true;$("pv").removeAttribute("src");$("file").value="";$("ft").textContent="Thêm sản phẩm"}
$("reset").onclick=reset;
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=async()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 const u=c.toDataURL("image/jpeg",.82);$("pv").src=u;img="";$("save").disabled=true;msg("Đang tải ảnh lên Drive...",15000);
 try{const j=await post({action:"upload",data:u.split(",")[1],mime:"image/jpeg"});if(j.ok){img=j.url;msg("Đã tải ảnh lên Drive ✔")}else alert("Tải ảnh lỗi: "+(j.error||"không rõ"))}catch(err){alert("Không tải được ảnh. Hãy chạy authorize_ trong Apps Script và triển khai lại phiên bản mới.")}
 $("save").disabled=false};im.src=URL.createObjectURL(f)};
$("save").onclick=async()=>{if(!$("n").value.trim()||!+$("pr").value)return msg("Nhập tên và giá");$("save").disabled=true;
 try{const j=await post({action:"saveProduct",product:{id:eid,n:$("n").value.trim(),d:$("d").value.trim(),p:+$("pr").value,o:+$("ol2").value||0,c:$("cat").value,e:$("em").value.trim()||"🍽️",t:$("tg").value.trim(),img,on:$("on").checked}});
 msg(j.ok?"Đã lưu ✔":"Lỗi lưu");if(j.ok){reset();load(true)}}catch(_){msg("Lỗi kết nối")}$("save").disabled=false};
$("pl").onclick=async e=>{const ed=e.target.dataset.e,x=e.target.dataset.x;
 if(ed){const p=D.products.find(q=>String(q.id)==ed);eid=p.id;img=p.img||"";$("n").value=p.n;$("d").value=p.d;$("pr").value=p.p;$("ol2").value=p.o||"";$("cat").value=p.c;$("em").value=p.e;$("tg").value=p.t||"";$("on").checked=p.on;if(img)$("pv").src=img;else $("pv").removeAttribute("src");$("ft").textContent="Sửa sản phẩm";scrollTo({top:0,behavior:"smooth"})}
 if(x&&confirm("Xóa sản phẩm này?")){await post({action:"deleteProduct",id:x});load(true)}};
$("sc").onclick=async()=>{const j=await post({action:"saveCfg",cfg:{paused:$("cp").checked,notice:$("cn").value,fee:+$("cf").value,free:+$("cr").value,open:+$("co").value,close:+$("cc").value}});msg(j.ok?"Đã lưu cài đặt ✔":"Lỗi lưu");if(j.ok)D.cfg=j.cfg};
if(KEY)load();
</script></body></html>
