<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Ăn Vặt Lâm Thao</title>
<style>
:root{--ink:#3a150e;--sun:#ffc20e;--red:#e0301f;--cream:#fff8ea;--line:#f0e2c8;--mute:#7b6258}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:40px}
header{background:var(--ink);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.w{max-width:760px;margin:auto;padding:0 12px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--sun);font-weight:700}
button.g{background:#fff;border:1px solid var(--line)}button.r{background:var(--red);color:#fff}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;background:#fff;border:2px solid var(--line)}.tabs button.on{background:var(--ink);color:#fff}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.c small{color:var(--mute)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}
.b{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sun);font-size:.8rem;font-weight:700}
.pv{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
.hide{display:none}#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:9}
</style></head><body>
<header><b>🛠️ Admin Ăn Vặt Lâm Thao</b><button class="g" id="out">Thoát</button></header>
<div class="w">
 <div id="login" class="c" style="margin-top:20px"><b>Đăng nhập</b><br><br><input id="key" type="password" placeholder="Mật khẩu admin (ADMIN_KEY)"><button id="go" style="width:100%">Vào</button></div>
 <div id="app" class="hide">
  <div class="tabs"><button data-t="o" class="on">Đơn hàng</button><button data-t="p">Sản phẩm</button><button data-t="r">Đánh giá</button></div>
  <div id="o"></div>
  <div id="p" class="hide">
   <div class="c"><b id="ft">Thêm sản phẩm</b><br><br>
    <input id="n" placeholder="Tên món"><input id="d" placeholder="Mô tả ngắn">
    <div class="row"><input id="pr" type="number" placeholder="Giá bán"><input id="ol" type="number" placeholder="Giá cũ (nếu có)"></div>
    <div class="row"><select id="cat"><option value="nhanh">Đồ ăn nhanh</option><option value="vat">Đồ ăn vặt</option><option value="uong">Đồ uống</option><option value="combo">Combo</option></select><input id="em" placeholder="Emoji 🍟"><input id="tg" placeholder="Nhãn (Bán chạy...)"></div>
    <div class="row" style="flex-wrap:nowrap"><img id="pv" class="pv" alt=""><input id="file" type="file" accept="image/*" style="flex:1"></div>
    <label><input id="on" type="checkbox" checked style="width:auto;margin:6px 6px 10px 0">Hiển thị trên web</label><br>
    <button id="save">Lưu sản phẩm</button> <button class="g" id="reset">Làm mới form</button></div>
   <div id="pl"></div>
  </div>
  <div id="r" class="hide"></div>
 </div>
</div><div id="msg"></div>
<script>
const API="https://script.google.com/macros/s/AKfycbyFkloT5OSrStEVY7vk2M1PTfxVerxJG-BzPUBThPqHse2LZOllHMigtpmaqN4ofXYQRA/exec";
const $=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=v=>Number(v||0).toLocaleString("vi-VN")+"đ";
let KEY=sessionStorage.getItem("ak")||"",D={orders:[],products:[],reviews:[],statuses:[]},img="",eid="";
function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}
async function post(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...o,key:KEY})});return r.json()}
async function load(){try{const j=await(await fetch(API+"?a=admin&key="+encodeURIComponent(KEY))).json();
  if(!j.ok){sessionStorage.removeItem("ak");$("login").classList.remove("hide");$("app").classList.add("hide");msg("Sai mật khẩu");return}
  D=j;sessionStorage.setItem("ak",KEY);$("login").classList.add("hide");$("app").classList.remove("hide");draw()}catch(e){msg("Không kết nối được máy chủ")}}
function draw(){
 $("o").innerHTML=D.orders.map(o=>`<div class="c"><div class="row"><b>${esc(o.code)}</b><span class="b">${esc(o.status)}</span></div><small>${esc(o.time)} · ${esc(o.pay)}</small>
 <p><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></p><p>${esc(o.address)}</p><p>${esc(o.items)}</p>${o.note?`<p><i>${esc(o.note)}</i></p>`:""}
 <p><b>${fmt(o.total)}</b> · <a href="${esc(o.map)}" target="_blank" rel="noopener">📍 Xem bản đồ</a></p>
 <select data-code="${esc(o.code)}">${D.statuses.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")||"<p>Chưa có đơn.</p>";
 $("pl").innerHTML=D.products.map(p=>`<div class="c row" style="flex-wrap:nowrap"><img class="pv" src="${esc(p.img||"")}" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1"><b>${esc(p.e)} ${esc(p.n)}</b> ${p.on?"":'<span class="b">Ẩn</span>'}<br><small>${fmt(p.p)} · ${esc(p.c)}</small></div><button class="g" data-e="${esc(p.id)}">Sửa</button><button class="r" data-x="${esc(p.id)}">Xóa</button></div>`).join("")||"<p>Chưa có sản phẩm. Web sẽ dùng menu mẫu cho đến khi bạn thêm món.</p>";
 $("r").innerHTML=D.reviews.map(r=>`<div class="c"><b>${esc(r.item)}</b> ${"★".repeat(r.stars)}<br>${esc(r.text)}<br><small>${esc(r.code)} · ${esc(r.time)}</small></div>`).join("")||"<p>Chưa có đánh giá.</p>"}
$("go").onclick=()=>{KEY=$("key").value.trim();load()};$("out").onclick=()=>{sessionStorage.removeItem("ak");location.reload()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x==b));["o","p","r"].forEach(t=>$(t).classList.toggle("hide",t!=b.dataset.t))});
$("o").onchange=async e=>{const s=e.target.dataset.code;if(!s)return;const j=await post({action:"setStatus",code:s,status:e.target.value});msg(j.ok?"Đã cập nhật trạng thái":"Lỗi");load()};
function reset(){eid="";img="";["n","d","pr","ol","em","tg"].forEach(i=>$(i).value="");$("on").checked=true;$("pv").removeAttribute("src");$("file").value="";$("ft").textContent="Thêm sản phẩm"}
$("reset").onclick=reset;
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=async()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 const u=c.toDataURL("image/jpeg",.82);$("pv").src=u;msg("Đang tải ảnh lên Drive...");const j=await post({action:"upload",data:u.split(",")[1],mime:"image/jpeg"});if(j.ok){img=j.url;msg("Đã tải ảnh lên Drive")}else msg("Tải ảnh lỗi")};im.src=URL.createObjectURL(f)};
$("save").onclick=async()=>{if(!$("n").value.trim()||!+$("pr").value)return msg("Nhập tên và giá");
 const j=await post({action:"saveProduct",product:{id:eid,n:$("n").value.trim(),d:$("d").value.trim(),p:+$("pr").value,o:+$("ol").value||0,c:$("cat").value,e:$("em").value.trim()||"🍽️",t:$("tg").value.trim(),img,on:$("on").checked}});
 msg(j.ok?"Đã lưu":"Lỗi lưu");if(j.ok){reset();load()}};
$("pl").onclick=async e=>{const ed=e.target.dataset.e,x=e.target.dataset.x;
 if(ed){const p=D.products.find(q=>String(q.id)==ed);eid=p.id;img=p.img||"";$("n").value=p.n;$("d").value=p.d;$("pr").value=p.p;$("ol").value=p.o||"";$("cat").value=p.c;$("em").value=p.e;$("tg").value=p.t||"";$("on").checked=p.on;if(img)$("pv").src=img;$("ft").textContent="Sửa sản phẩm";scrollTo({top:0,behavior:"smooth"})}
 if(x&&confirm("Xóa sản phẩm này?")){await post({action:"deleteProduct",id:x});load()}};
if(KEY)load();
</script></body></html>
